<style>
  :root{
    --bg:#fafafa;
    --card-bg:#ffffff;
    --text:#1a1a1a;
    --text-muted:#5c5c5c;
    --accent:#d64d7a;
    --accent-text:#ffffff;
    --badge-bg:#f5f5f5;
    --badge-text:#666666;
    --track-bg:#ececec;
    --tick:#d8d8d8;
    --tick-major:#9a9a9a;
    --info-bg:#f2f2f2;
    --info-icon-bg:#fbe1ea;
    --card-border:#eee;
    --ph-bg:#f0f0f0;
    --ph-text:#999999;
    --green:#3fa66a;
    --green-bg:#e6f4ea;
    --red:#d0483f;
    --red-bg:#fbe7e5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Poppins',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  #app{min-height:100vh;display:flex;flex-direction:column}

  .hdr{display:flex;align-items:center;justify-content:center;position:relative;padding:.75rem 1rem;background:var(--card-bg)}
  .hdr-back{position:absolute;left:1rem;top:50%;transform:translateY(-50%);width:1.5rem;height:1.5rem;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;background:none;border:none;padding:0}
  .hdr-back[disabled]{visibility:hidden}
  .hdr-logo-wrap{display:flex;align-items:center;gap:.5rem}
  .hdr-logo{font-family:'Anton',system-ui,sans-serif;color:var(--accent);font-size:1.6rem;letter-spacing:.03em}
  .hdr-badge{font-size:.7rem;background:var(--badge-bg);color:var(--badge-text);padding:.15rem .55rem;border-radius:.3rem}
  .progress{height:4px;background:var(--track-bg)}
  .progress-fill{height:100%;background:var(--accent);transition:width .3s ease;width:0%}

  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem 2.5rem;position:relative;overflow:hidden}
  .card{width:100%;max-width:560px;margin:0 auto}

  h1{text-align:center;font-size:1.55rem;font-weight:700;line-height:1.28;margin:.25rem 0 .5rem;text-wrap:balance}
  h1 .hl{color:var(--accent)}
  .sub{text-align:center;color:var(--text-muted);font-size:1rem;line-height:1.5;margin:0 0 1.5rem}
  .eyebrow{text-align:center;font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:.6rem 0 0;color:var(--text)}
  .age-question{font-weight:700;color:var(--text);font-size:1.2rem;margin:.5rem 0 0 !important}

  /* generic placeholder box (used for hero photos) */
  .ph-box{background:var(--ph-bg);border-radius:1.1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;color:var(--ph-text);text-align:center;padding:1rem;width:100%;height:100%}
  .ph-box svg{opacity:.5}
  .ph-box .lbl{font-size:.85rem}
  .ph-box code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.7rem;background:rgba(0,0,0,.06);padding:.15rem .4rem;border-radius:.3rem}
  .ph-img{width:100%;height:100%;overflow:hidden;background:var(--ph-bg)}

  /* age-select screen (step 1) */
  .age-btns{margin-top:.4rem;display:flex;flex-direction:column;gap:.5rem;width:70%;max-width:300px;position:relative;z-index:10;margin-left:auto;margin-right:auto}
  .hero-center-ph{width:34%;max-width:130px;aspect-ratio:130/175;margin:.15rem auto 0}
  .hero-center-ph .ph-img{background:transparent}
  .age-btn{background:#f5f5f5;border-radius:12px;padding:1rem 1.25rem;font-weight:600;font-size:1rem;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border:none;width:100%;text-align:left;transition:background .15s;min-height:56px;font-family:inherit;color:var(--text)}
  .age-btn:hover{background:#ebebeb}
  .age-btn svg{width:20px;height:20px;color:#999;flex-shrink:0}
  .age-body{position:relative;width:100%;flex:1;min-height:420px}
  .hero-side-ph{position:absolute;right:-8px;bottom:0;top:auto;width:46%;max-width:230px;aspect-ratio:230/340;pointer-events:none;z-index:0}
  .hero-side-ph .ph-img{background:transparent}
  @media(max-width:480px){.hero-side-ph{right:-4px;width:48%;max-width:210px}}
  .ftr{padding:1rem;text-align:center;font-size:.75rem;color:var(--text-muted);margin-top:auto}
  .ftr a{text-decoration:underline;color:inherit}

  /* proof/info screens with top photo */
  .top-photo{width:100%;aspect-ratio:16/9.6;margin-bottom:1.25rem}
  .sales-photo{width:100%;border-radius:1rem;overflow:hidden;background:var(--ph-bg)}
  .sales-photo img{width:100%;height:100%;display:block}

  /* simple option list */
  .opt-list{display:flex;flex-direction:column;gap:.75rem;margin-top:.5rem}
  .opt-btn{background:#f5f5f5;border:none;border-radius:12px;padding:1rem 1.25rem;font-weight:600;font-size:1rem;text-align:left;cursor:pointer;font-family:inherit;color:var(--text);transition:background .15s}
  .opt-btn:hover{background:#ebebeb}
  .opt-btn .desc{display:block;font-weight:400;font-size:.85rem;color:var(--text-muted);margin-top:.15rem}
  .opt-btn .emoji{font-size:1.4rem;margin-right:.5rem}

  .icon-badge{width:44px;height:44px;border-radius:13px;background:#f4eef1;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .opt-thumb{width:48px;height:48px;border-radius:12px;overflow:hidden;flex:0 0 auto;display:block}
  .opt-thumb .ph-img{width:100%;height:100%}
  .icon-badge svg{width:22px;height:22px;color:var(--accent)}
  .opt-card{display:flex;align-items:center;gap:.9rem;background:#fff;border:none;border-radius:16px;padding:.85rem 1.1rem;box-shadow:0 1px 4px rgba(0,0,0,.07);cursor:pointer;font-family:inherit;text-align:left;width:100%;margin-bottom:.75rem}
  .opt-card .t{flex:1;font-weight:700;font-size:.98rem;color:var(--text);line-height:1.35}
  .opt-card .t .d{font-weight:400;font-size:.82rem;color:var(--text-muted);margin-top:.15rem}
  .opt-card .chev{color:#999;flex:0 0 auto;width:20px;height:20px}
  .opt-card .chev svg{width:100%;height:100%}

  /* image-grid single select */
  .img-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:.5rem}
  .img-list{display:flex;flex-direction:column;gap:.75rem;margin-top:.5rem}
  .img-list-row{display:flex;align-items:center;gap:.9rem;background:#fff;border:none;border-radius:16px;padding:.6rem .9rem;box-shadow:0 1px 4px rgba(0,0,0,.07);cursor:pointer;font-family:inherit;text-align:left;width:100%}
  .img-list-row .thumb{width:56px;height:56px;border-radius:12px;overflow:hidden;flex:0 0 auto}
  .img-list-row .thumb img{width:100%;height:100%;object-fit:cover}
  .img-list-row .cap{font-weight:700;font-size:.98rem;color:var(--text)}
  .expert-compose{display:flex;justify-content:center;margin:.5rem 0 1rem}
  .expert-compose img{max-height:190px;width:auto;max-width:70%;object-fit:contain}
  .img-card{border:none;background:none;cursor:pointer;font-family:inherit;padding:0;display:flex;flex-direction:column;align-items:center;gap:.6rem}
  .img-card .ph-box,.img-card .ph-img{width:100%;aspect-ratio:1/1;border-radius:50%}
  .img-card .cap{font-weight:600;font-size:.95rem;color:var(--text)}

  /* multi-select rows with thumbnail */
  .toggle-row{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem}
  .switch{width:2.5rem;height:1.4rem;border-radius:999px;background:#ddd;position:relative;flex:0 0 auto;cursor:pointer;transition:background .15s}
  .switch.on{background:var(--accent)}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:1.1rem;height:1.1rem;border-radius:50%;background:#fff;transition:left .15s}
  .switch.on::after{left:1.12rem}
  .toggle-row .lbl{font-size:.95rem}

  .multi-row{display:flex;align-items:center;gap:.9rem;background:var(--card-bg);border:1px solid transparent;border-radius:16px;padding:.8rem 1.1rem;margin-bottom:.75rem;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.07)}
  .multi-row.checked{border-color:var(--accent);background:#fdf3f6}
  .multi-row .thumb{width:44px;height:44px;border-radius:10px;flex:0 0 auto;background:var(--ph-bg)}
  .multi-row .thumb.round{border-radius:50%}
  .multi-row .emoji-thumb{width:44px;height:44px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:1.6rem}
  .multi-row .txt{flex:1}
  .multi-row .txt .t{font-weight:600;font-size:.95rem}
  .multi-row .txt .d{font-size:.8rem;color:var(--text-muted);margin-top:.1rem}
  .checkbox{width:22px;height:22px;border-radius:50%;border:2px solid #ccc;flex:0 0 auto;position:relative}
  .multi-row.checked .checkbox{border-color:var(--accent);background:var(--accent)}
  .multi-row.checked .checkbox::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}

  .btn{display:block;width:100%;text-align:center;background:var(--accent);color:var(--accent-text);font-weight:600;font-size:1.05rem;padding:1rem;border-radius:999px;border:none;cursor:pointer;font-family:inherit;margin-top:.5rem}
  .btn[disabled]{opacity:.4;cursor:not-allowed}

  /* slider (height/weight) */
  .unit-toggle{display:flex;justify-content:center;gap:.5rem;margin-bottom:1.5rem}
  .unit-btn{border:none;cursor:pointer;font-family:inherit;font-size:1rem;padding:.5rem 1.3rem;border-radius:999px;background:var(--badge-bg);color:var(--text-muted)}
  .unit-btn.active{background:var(--accent);color:var(--accent-text);font-weight:600}
  .value-display{text-align:center;margin-bottom:1.75rem}
  .value-display .num{font-size:3.4rem;font-weight:800;letter-spacing:-.02em}
  .value-display .unit{font-size:1.1rem;color:var(--text-muted);margin-left:.2rem}
  .ruler-wrap{position:relative;margin-bottom:.5rem}
  .ruler-marker{position:absolute;left:50%;top:0;transform:translateX(-50%);width:2px;height:38px;background:var(--accent);pointer-events:none}
  .ruler-marker::after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:8px solid var(--accent)}
  .ruler-scroll{overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;cursor:grab;padding-top:38px;user-select:none}
  .ruler-scroll::-webkit-scrollbar{display:none}
  .ruler-scroll.dragging{cursor:grabbing}
  .ruler-track{display:flex;align-items:flex-end;height:34px}
  .tick{flex:0 0 auto;width:14px;display:flex;flex-direction:column;align-items:center;scroll-snap-align:center;position:relative}
  .tick .bar{width:1px;height:14px;background:var(--tick)}
  .tick.major .bar{height:26px;width:2px;background:var(--tick-major)}
  .tick .tlbl{position:absolute;top:30px;font-size:.75rem;color:var(--text-muted);white-space:nowrap}
  .ruler-caption{text-align:center;font-size:.85rem;color:#b3b3b3;margin:1.75rem 0 1.25rem}
  .info-box{display:flex;align-items:flex-start;gap:.7rem;background:var(--info-bg);border-radius:.85rem;padding:.9rem 1rem;margin-bottom:1.25rem}
  .info-icon{flex:0 0 auto;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--info-icon-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;font-style:italic;margin-top:.1rem}
  .info-box .itxt .t{font-size:.95rem;font-weight:600}
  .info-box .itxt .d{font-size:.85rem;color:var(--text-muted);margin-top:.25rem;line-height:1.4}

  /* text input */
  .text-input{width:100%;font-size:1.05rem;font-family:inherit;padding:1rem 1.1rem;border-radius:12px;border:1px solid #ddd;background:#fff;color:var(--text);margin-bottom:1.25rem}
  .text-input:focus{outline:none;border-color:var(--accent)}

  /* chart */
  .chart-img-wrap{width:100%;aspect-ratio:1803/872;margin:1.1rem 0 1.4rem}
  .chart-img-wrap img{width:100%;height:100%;object-fit:contain;display:block}

  /* loading */
  .loading-bar-track{height:8px;border-radius:999px;background:var(--track-bg);overflow:hidden;margin:1.5rem 0 1rem}
  .loading-bar-fill{height:100%;background:var(--accent);width:0%;transition:width .2s linear}
  .loading-pct{text-align:center;font-weight:700;font-size:1.1rem;margin-bottom:1.5rem}
  .loading-cap{text-align:center;font-size:.85rem;color:var(--text-muted);margin-top:.75rem}
  .transform-fade{position:relative;width:100%;max-width:340px;margin:0 auto;aspect-ratio:1/1;border-radius:1rem;overflow:hidden;background:var(--ph-bg)}
  .tf-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s ease}
  .tf-img.active{opacity:1}

  .done-wrap{text-align:center}
  .done-wrap .big{font-size:2.4rem;margin-bottom:.5rem}

  /* plan reveal chart (step 30) */
  .decline-chart{margin:1rem 0}
  .decline-badge{font-size:.8rem;font-weight:700;padding:.2rem .55rem;border-radius:.4rem}
  .decline-badge.start{background:#fbe1e1;color:var(--red)}
  .decline-badge.end{background:var(--green);color:#fff}
  .decline-mid{font-size:.7rem;background:#fff;border:1px solid #ddd;padding:.15rem .5rem;border-radius:.4rem;color:var(--text-muted)}
  .kg-hl{background:#dceeff;color:#1a6fb0;font-weight:700;padding:.2rem .6rem;border-radius:.4rem}

  /* IMC profile card (step 31) */
  .imc-card{background:#fff;border:1px solid var(--card-border);border-radius:16px;padding:1.25rem;margin-bottom:1rem}
  .imc-title{font-weight:700;margin-bottom:1.75rem;font-size:1rem}
  .imc-scale-wrap{position:relative}
  .imc-badge{position:absolute;top:-1.9rem;transform:translateX(-50%);background:#1a1a1a;color:#fff;font-size:.75rem;font-weight:700;padding:.25rem .6rem;border-radius:.4rem;white-space:nowrap}
  .imc-bar{height:8px;border-radius:999px;background:linear-gradient(90deg,#3fa66a,#f4d35e,#e08a3c,#d0483f);position:relative}
  .imc-dot{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #1a1a1a;transform:translate(-50%,-50%)}
  .imc-nums{display:flex;justify-content:space-between;font-size:.72rem;color:var(--text-muted);margin-top:.5rem}
  .imc-labels{display:flex;justify-content:space-between;font-size:.62rem;color:var(--text-muted);margin-top:.3rem;text-transform:uppercase;letter-spacing:.02em}
  .imc-labels .active{color:var(--text);font-weight:700}
  .alert-box{background:var(--red-bg);border:1px solid #f3c9c5;border-radius:14px;padding:1rem;margin-bottom:1rem}
  .alert-box .at{color:var(--red);font-weight:700;margin-bottom:.4rem;display:flex;align-items:center;gap:.4rem;font-size:.95rem}
  .alert-box .ad{font-size:.85rem;color:#8a3630;line-height:1.5}
  .info-row{display:flex;align-items:center;gap:.8rem;padding:.85rem 0;border-bottom:1px solid var(--card-border)}
  .info-row:last-child{border-bottom:none}
  .info-row .ic{font-size:1.2rem;flex:0 0 auto}
  .info-row .rt{font-size:.78rem;color:var(--text-muted)}
  .info-row .rv{font-weight:700;font-size:.95rem}

  /* plan-ready card (step 34) */
  .plan-card{background:#fff;border:1px solid var(--card-border);border-radius:16px;padding:1.25rem;margin-bottom:1rem}
  .plan-photos{display:flex;align-items:center;justify-content:center;gap:.6rem;margin-bottom:1rem}
  .plan-photos .col{text-align:center;flex:1}
  .plan-photos .col .cap{font-size:.8rem;color:var(--text-muted);margin-bottom:.5rem}
  .plan-photos .ph-box,.plan-photos .ph-img{aspect-ratio:3/4;border-radius:14px}
  .plan-photos .arrows{color:#ccc;font-size:1.2rem;flex:0 0 auto}
  .plan-stats{display:flex;gap:1rem;padding-top:.75rem;border-top:1px solid var(--card-border)}
  .plan-stats .col{flex:1}
  .plan-stats .k{font-size:.78rem;color:var(--accent);margin-top:.6rem}
  .plan-stats .v{font-weight:700;font-size:1.05rem}
  .seg-bar{display:flex;gap:.25rem;margin-top:.4rem}
  .seg-bar span{height:5px;flex:1;border-radius:999px;background:#f0d3dc}
  .seg-bar span.on{background:var(--accent)}
  .focus-box{background:#fdeef2;border-radius:12px;padding:.85rem 1rem;margin-bottom:.75rem;font-size:.9rem}
  .focus-box b{color:var(--accent)}
  .note-box{display:flex;gap:.7rem;background:#f7f7f7;border-radius:12px;padding:.85rem 1rem;margin-bottom:.75rem;font-size:.85rem;color:var(--text-muted);line-height:1.5}
  .note-box .ic{flex:0 0 auto}

  /* video final (step 35) */
  .video-ph{position:relative;width:100%;aspect-ratio:9/13;border-radius:1rem;overflow:hidden;background:#e5e0d8}
  .video-ph .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.5rem}
  .video-ph .circle{width:64px;height:64px;border-radius:50%;background:#c0392b;display:flex;align-items:center;justify-content:center}
  .video-ph .circle svg{width:26px;height:26px;fill:#fff;margin-left:3px}
  .video-ph .caption{background:#c0392b;color:#fff;font-size:.75rem;font-weight:700;padding:.25rem .8rem;border-radius:.3rem}

  /* sales page (revealed after the VSL timer) */
  #salesPageSlot{opacity:0;max-height:0;overflow:hidden;transition:opacity .6s ease}
  #salesPageSlot.reveal{opacity:1;max-height:none;overflow:visible}
  .sales-page{max-width:560px;margin:2rem auto 0;text-align:left}
  .sp-h2{font-size:1.35rem;font-weight:700;text-align:center;margin:0 0 1rem;text-wrap:balance}
  .cta-btn{text-decoration:none;box-sizing:border-box;background:#1fa64d}
  .cta-btn:visited{color:var(--accent-text)}
  .cta-top{margin-bottom:0}
  .stock-pill{display:block;width:max-content;margin:0 auto;background:#fdeef2;color:var(--accent);font-weight:700;font-size:.85rem;padding:.4rem 1rem;border-radius:999px}
  .bullet-list{margin-bottom:.5rem}
  .bullet-row{display:flex;gap:.65rem;align-items:flex-start;margin-bottom:.85rem;font-size:.95rem;line-height:1.5}
  .bullet-check{color:#1fa64d;font-weight:700;flex:0 0 auto;margin-top:.1rem}
  .price-block{background:#fff;border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,.07);padding:1.25rem 1.25rem 1.5rem;text-align:center;margin:1.5rem 0}
  .price-row{margin:.3rem 0}
  .price-old{color:var(--text-muted);text-decoration:line-through;font-size:1rem}
  .price-lbl{font-size:1rem;color:var(--text-muted)}
  .price-new{font-size:1.9rem;font-weight:800;color:#1fa64d}
  .price-note{font-size:.8rem;color:var(--text-muted);margin:.25rem 0}
  .testimonial{margin-bottom:1.75rem}
  .t-tag{font-weight:700;margin-bottom:.4rem}
  .t-quote{font-size:.92rem;color:var(--text-muted);line-height:1.55;font-style:italic}
  .bonus-list{margin-bottom:1.5rem}
  .bonus-row{display:flex;gap:.75rem;align-items:flex-start;margin-bottom:1rem;font-size:.92rem;line-height:1.5}
  .bonus-n{flex:0 0 auto;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center}
  .guarantee-box{background:#fff;border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,.07);padding:1.5rem;text-align:center;margin-bottom:1.5rem}
  .faq-list{margin-bottom:1.5rem}

  function renderPlanReveal(step){

    h += '<p class="sub">Prevemos que você estará com</p>';
    h += '<p style="text-align:center;margin:.25rem 0 1rem"><span class="kg-hl">' + endKg + 'kg</span> <b>em até ' + step.days + ' dias</b></p>';
    var DW = 420, DH = 175;
    var p0 = {x:22, y:35}, p1 = {x:150, y:110}, p2 = {x:270, y:130}, p3 = {x:398, y:134};
    function bez(t){
      var mt = 1-t;
      return {
        x: mt*mt*mt*p0.x + 3*mt*mt*t*p1.x + 3*mt*t*t*p2.x + t*t*t*p3.x,
        y: mt*mt*mt*p0.y + 3*mt*mt*t*p1.y + 3*mt*t*t*p2.y + t*t*t*p3.y
      };
    }
    var mid = bez(0.42);
    function dpct(pt){ return { l:(pt.x/DW*100).toFixed(2)+'%', t:(pt.y/DH*100).toFixed(2)+'%' }; }
    var path = 'M' + p0.x + ',' + p0.y + ' C' + p1.x + ',' + p1.y + ' ' + p2.x + ',' + p2.y + ' ' + p3.x + ',' + p3.y;
    var areaPath = path + ' L' + p3.x + ',' + (DH-15) + ' L' + p0.x + ',' + (DH-15) + ' Z';

    h += '<div class="decline-chart" style="position:relative">';
    h += '<svg viewBox="0 0 ' + DW + ' ' + DH + '" width="100%" style="display:block">';
    h += '<defs><linearGradient id="declineGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#d0483f"/><stop offset="50%" stop-color="#e8b84b"/><stop offset="100%" stop-color="#3fa66a"/></linearGradient>';
    h += '<linearGradient id="declineFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e8b84b" stop-opacity="0.32"/><stop offset="100%" stop-color="#3fa66a" stop-opacity="0.18"/></linearGradient></defs>';
    h += '<path d="' + areaPath + '" fill="url(#declineFill)"/>';
    h += '<path d="' + path + '" fill="none" stroke="url(#declineGrad)" stroke-width="4" stroke-linecap="round"/>';
    h += '<circle cx="' + p0.x + '" cy="' + p0.y + '" r="5" fill="#d0483f"/>';
    h += '<circle cx="' + mid.x.toFixed(1) + '" cy="' + mid.y.toFixed(1) + '" r="4.5" fill="#e8a83c"/>';
    h += '<circle cx="' + p3.x + '" cy="' + p3.y + '" r="5" fill="#3fa66a"/>';
    h += '</svg>';
    var pS = dpct(p0), pM = dpct(mid), pE = dpct(p3);
    h += '<span class="decline-badge start" style="position:absolute;left:' + pS.l + ';top:' + pS.t + ';transform:translate(-8%,-150%)">' + startKg + 'kg</span>';
    h += '<span class="decline-mid" style="position:absolute;left:' + pM.l + ';top:' + pM.t + ';transform:translate(-50%,-160%)">Semana 2</span>';
    h += '<span class="decline-badge end" style="position:absolute;left:' + pE.l + ';top:' + pE.t + ';transform:translate(-92%,-150%)">' + endKg + 'kg</span>';
    h += '</div>';
    h += '<h1 style="color:var(--accent);font-size:1.3rem">Protocolo de ' + step.days + ' dias quase pronto!</h1>';
    h += '<p class="sub">De acordo com as suas respostas, você está pronta para ter resultados em ' + step.days + ' dias com o nosso programa.</p>';
    h += '<button class="btn" onclick="__fn.next()">Continuar</button>';
    return h;
  }

  function startVslTimer(){
    if (!document.getElementById('vid-6a926075cd983e8ee7e2752b')) return;
    if (!window.__vturbLoaded){
      window.__vturbLoaded = true;
      var s = document.createElement('script');
      s.src = 'https://scripts.converteai.net/46297f0e-da56-4b17-a761-6026820d11d1/players/6a926075cd983e8ee7e2752b/v4/player.js';
      s.async = true;
      document.head.appendChild(s);
    }
    var slot = document.getElementById('salesPageSlot');
    if (!slot) return;
    setTimeout(function(){
      if (!document.body.contains(slot)) return; // user already navigated away
      slot.innerHTML = renderSalesPageHtml();
      slot.classList.add('reveal');
    }, VSL_REVEAL_SECONDS * 1000);
  }

  function runLoadingAnimation(){
    var fill = document.getElementById('loadFill');
    var pctEl = document.getElementById('loadPct');
    if (!fill) return;
    var pct = 0;
    updateTransformImage(pct);
    var timer = setInterval(function(){
      pct += 2;
      if (pct >= 100){
        pct = 100;
        clearInterval(timer);
        setTimeout(function(){ goNext(); }, 500);
      }
      fill.style.width = pct + '%';
      if (pctEl) pctEl.textContent = pct + '%';
      updateTransformImage(pct);
    }, 130);
  }

  // ---------- slider engine ----------
  var TICK_W = 14;
  function buildRuler(min, max, val){
    var track = document.getElementById('rulerTrack');
    var scroll = document.getElementById('rulerScroll');
    if (!track) return;
    track.innerHTML = '';
    for (var v = min; v <= max; v++){
      var tick = document.createElement('div');
      tick.className = 'tick' + (v % 10 === 0 ? ' major' : '');
      var bar = document.createElement('div');
      bar.className = 'bar';
      tick.appendChild(bar);
      if (v % 10 === 0){
        var lbl = document.createElement('span');
        lbl.className = 'tlbl';
        lbl.textContent = v;
        tick.appendChild(lbl);
      }
      track.appendChild(tick);
    }
    var pad = 'calc(50% - ' + (TICK_W/2) + 'px)';
    track.style.paddingLeft = pad;
    track.style.paddingRight = pad;

    var scrollTimer = null;
    scroll.onscroll = function(){
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(function(){
        var idx = Math.round(scroll.scrollLeft / TICK_W);
        var v2 = min + idx;
        applySliderValue(v2);
      }, 60);
    };
    var isDown = false, startX, startScroll;
    scroll.onmousedown = function(e){ isDown = true; scroll.classList.add('dragging'); startX = e.pageX; startScroll = scroll.scrollLeft; };
    window.addEventListener('mouseup', function(){ isDown = false; scroll.classList.remove('dragging'); });
    window.addEventListener('mousemove', function(e){ if(!isDown) return; e.preventDefault(); scroll.scrollLeft = startScroll - (e.pageX - startX); });

    requestAnimationFrame(function(){
      scroll.scrollTo({ left: (val - min) * TICK_W, behavior: 'auto' });
    });
  }

  function currentSliderRange(){
    var step = STEPS[state.idx];
    if (step.type === SLIDER_H){
      return state.heightUnit === 'cm' ? {min:120,max:220} : {min:47,max:87};
    } else {
      return state.weightUnit === 'kg' ? {min:30,max:200} : {min:66,max:440};
    }
  }

  function applySliderValue(v){
    var step = STEPS[state.idx];
    if (step.type === SLIDER_H) state.heightCm = state.heightUnit==='cm' ? v : Math.round(v*2.54);
    else if (step.target) state.targetKg = state.weightUnit==='kg' ? v : Math.round(v/2.20462);
    else state.weightKg = state.weightUnit==='kg' ? v : Math.round(v/2.20462);
    var numEl = document.getElementById('sliderNum');
    if (numEl) numEl.textContent = v;
    // live-update BMI caption for current-weight step
    if (step.type === SLIDER_W && !step.target){
      var b = bmiText();
      var t = document.querySelector('.info-box .t');
      if (t) t.innerHTML = 'Seu IMC é ' + b.bmi + ', que é considerado ' + bmiClsHtml(b.cls) + '.';
    }
  }

  function setupSlider(){
    var step = STEPS[state.idx];
    if (step.type !== SLIDER_H && step.type !== SLIDER_W) return;
    var r = currentSliderRange();
    var val = step.type === SLIDER_H
      ? (state.heightUnit==='cm' ? state.heightCm : Math.round(state.heightCm/2.54))
      : (step.target
          ? (state.weightUnit==='kg' ? state.targetKg : Math.round(state.targetKg*2.20462))
          : (state.weightUnit==='kg' ? state.weightKg : Math.round(state.weightKg*2.20462)));
    buildRuler(r.min, r.max, val);
  }

  // ---------- public fns ----------
  window.__fn = {
    next: goNext,
    back: goBack,
    trackCheckout: function(){
      try { if (window.fbq) fbq('track', 'InitiateCheckout'); } catch(e){}
    },
    selectAge: function(i){ state.ageBand = i; goNext(); },
    toggleItem: function(i){
      var st = state.multi[state.idx];
      var step = STEPS[state.idx];
      if (st.sel.has(i)) st.sel.delete(i); else st.sel.add(i);
      if (step.toggle){
        st.toggle = step.items.length > 0 && st.sel.size === step.items.length;
      }
      render();
    },
    toggleAll: function(){
      var st = state.multi[state.idx];
      var step = STEPS[state.idx];
      st.toggle = !st.toggle;
      if (st.toggle){
        step.items.forEach(function(_, i){ st.sel.add(i); });
      } else {
        st.sel.clear();
      }
      render();
    },
    sliderUnit: function(u){
      var step = STEPS[state.idx];
      if (step.type === SLIDER_H) state.heightUnit = u;
      else state.weightUnit = (u === 'kg' ? 'kg' : 'lb');
      render();
    },
    ageInput: function(v){
      state.ageValue = v;
      var btn = document.getElementById('textInBtn');
      if (btn) btn.disabled = !v;
    }
  };

  function afterRender(step){
    if (step.type === SLIDER_H || step.type === SLIDER_W) setupSlider();
    if (step.type === LOADING){ runLoadingAnimation(); runTransformFade(); }
    if (step.type === 'video-final') startVslTimer();
  }

  try {
    var __qsStep = new URLSearchParams(window.location.search).get('step');
    if (__qsStep !== null){
      var n = parseInt(__qsStep, 10);
      if (!isNaN(n) && n >= 0 && n < STEPS.length) state.idx = n;
    }
  } catch(e){}
  render();
})();
</script>
